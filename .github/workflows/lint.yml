# Every connector file must at least parse: the folders are zipped as they are
# and handed to customers.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Lint the connector source
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { echo "::error file=$f::PHP syntax error"; fail=1; }
          done < <(find . -path ./e2e -prune -o -path ./.git -prune -o \( -name '*.php' -o -name '*.pdt' -o -name '*.phtml' \) -print0)
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::Python syntax error"; fail=1; }
          done < <(find . -path ./e2e -prune -o -path ./.git -prune -o -name '*.py' -print0)
          while IFS= read -r -d '' f; do
            python3 -c 'import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' "$f" || { echo "::error file=$f::XML is not well-formed"; fail=1; }
          done < <(find . -path ./e2e -prune -o -path ./.git -prune -o -name '*.xml' -print0)
          while IFS= read -r -d '' f; do
            python3 -c 'import sys, json; json.load(open(sys.argv[1]))' "$f" || { echo "::error file=$f::JSON is not valid"; fail=1; }
          done < <(find . -path ./e2e -prune -o -path ./.git -prune -o -name '*.json' -print0)
          exit "$fail"
