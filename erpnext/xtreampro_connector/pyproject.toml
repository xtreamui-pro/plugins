[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "xtreampro_connector"
authors = [
    { name = "Xtream UI Pro", email = "support@example.com"}
]
description = "Sell IPTV lines and sub-reseller accounts from ERPNext through the Xtream UI Pro Reseller API"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # requests is installed with Frappe; no other third-party package is needed
]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
